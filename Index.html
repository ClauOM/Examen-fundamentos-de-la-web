<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlorManía - Tienda de Flores</title>
    <link rel="stylesheet" href="Style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
    <Header>
        <div class="logo">Flor<span>Manía</span></div>
        <nav class="barra">
            <a href="#" id="enlace-flores">Envía Flores</a>
            <a href="#">Nosotros</a>
            <button id="inicia-sesion">Inicia Sesión </button>
        </nav>

    </Header>
    <nav>
        <a href="#">Girasoles</a>
        <a href="#">Rosas</a>
        <a href="#">Claveles</a>
        <a href="#">Tulipanes</a>
        <a href="#">Orquídeas</a>
        <a href="#">Margarítas</a>
    </nav>
    <main class="container">
        <section class="flor-del-mes">
            <h2>Flor del mes</h2>
            <img src="Images/flor-del-mes.jpg" alt="Flor-del-mes">
        </section>
        <section class="resultados">
            <p>Mostrando <span>50 resultados</span></p>
            <a href="#">Ver más flores</a>
        </section>
        <section class="productos">
            <article class="producto">
                <div class="imagen">
                    <img src="Images/ramo-de-rosas.jpg" alt="ramo-de-rosas">
                </div>
                <div class="detalle">
                    <div class="informacion">
                        <p>Ramo de rosas</p>
                        <span>$40.00</span>
                    </div>
                    <button class="comprar">Comprar</button>
                </div>
            </article>
            <article class="producto">
                <div class="imagen">
                    <img src="Images/arreglo-tulipanes.jpg" alt="arreglo-tulipanes">
                </div>
                <div class="detalle">
                    <div class="informacion">
                        <p>Arreglo tulipanes</p>
                        <span>$50.00</span>
                    </div>
                    <button class="comprar">Comprar</button>
                </div>
            </article>
            <article class="producto">
                <div class="imagen">
                    <img src="Images/bouquet-lirios.jpg" alt="bouquet-lirios">
                </div>
                <div class="detalle">
                    <div class="informacion">
                        <p>Bouquet lirios</p>
                        <span>$25.00</span>
                    </div>
                    <button class="comprar">Comprar</button>
                </div>
            </article>
        </section>
    </main>
    <footer></footer>
    
</body>
</html>
